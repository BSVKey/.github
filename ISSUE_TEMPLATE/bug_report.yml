name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, code or inputs. Never paste private keys, WIFs, seeds or channel secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit, plus your Node.js version
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, txids, screenshots
